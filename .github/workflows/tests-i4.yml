name: Tests I4

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  i4:
    name: I4 webhooks et API tierce (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: i4-webhooks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: i4-webhooks/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v
